services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: stops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowdetect-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowdetect-network

  flowdetect-app:
    build:
      context: ./backend-core/flowdetect
    container_name: flowdetect-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      ML_FORECAST_SERVICE_URL: http://load-forecast-service:8082
      MODELING_SERVICE_URL: http://transport-modeling-service:8084
    ports:
      - "8080:8080"
    volumes:
      - ./backend-core/flowdetect/logs:/app/logs
    networks:
      - flowdetect-network

  load-forecast-service:
    build:
      context: ./load-forecast-service
      dockerfile: Dockerfile
    container_name: load-forecast-service
    ports:
      - "8082:8082"
    volumes:
      - ./load-forecast-service/logs:/app/logs
      - ./load-forecast-service/models:/app/models
    environment:
      - PYTHONPATH=/app
      - MODEL_WEIGHTS_PATH=/app/models/best_powerful_model.weights.h5
      - PREPROCESSOR_PATH=/app/models/preprocessor.pkl
      - TF_ENABLE_ONEDNN_OPTS=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - flowdetect-network

  passenger-flow-predicted:
    build:
      context: ./passenger-flow-predicted
      dockerfile: Dockerfile
    container_name: passenger-flow-predicted
    ports:
      - "8083:8083"
    environment:
      DB_URL: postgresql://postgres:postgres@postgres:5432/stops
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./passenger-flow-predicted/result/models:/app/result/models
    
    # GPU ACCESS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - flowdetect-network

  transport-modeling-service:
    build:
      context: ./transport-modeling-service
      dockerfile: Dockerfile
    container_name: transport-modeling-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=stops
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - FLOWDETECT_URL=http://flowdetect-app:8080
      - FORECAST_SERVICE_URL=http://load-forecast-service:8082
      - CACHE_TTL_DAYS=30
      - HISTORY_DAYS=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flowdetect-app:
        condition: service_started
      load-forecast-service:
        condition: service_healthy
    volumes:
      - ./transport-modeling-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - flowdetect-network

  video-stream-service:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: video-stream-service
    depends_on:
      flowdetect-app:
        condition: service_started
    build:
      context: ./video-stream-service
    entrypoint: bash -c "uv run ./video-stream-service/startup_video_capture.py"
    volumes:
      - type: bind
        source: .
        target: /code
        bind:
          propagation: rprivate
      - /code/.venv
    restart: on-failure
    networks:
      - flowdetect-network

  # web-client:
  #   build:
  #     context: ./web-client
  #   container_name: web-client
  #   ports:
  #     - "5174:5174"
  #   environment:
  #     - NODE_ENV=development
  #     - VITE_HOST=0.0.0.0
  #     - VITE_API_URL=http://localhost:8080
  #   depends_on:
  #     - flowdetect-app

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8080
      - VITE_MODELING_URL=http://localhost:8084
    depends_on:
      - flowdetect-app
      - transport-modeling-service
    networks:
      - flowdetect-network

volumes:
  postgres_data:
  redis_data:

networks:
  flowdetect-network:
    driver: bridge