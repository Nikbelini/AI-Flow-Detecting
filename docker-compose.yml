version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: stops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  flowdetect-app:
    build:
      context: ./backend-core/flowdetect
    container_name: flowdetect-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ML_FORECAST_SERVICE_URL: http://load-forecast-service:8082
    ports:
      - "8080:8080"
    volumes:
      - ./backend-core/flowdetect/logs:/app/logs

  load-forecast-service:
    build:
      context: ./load-forecast-service
      dockerfile: Dockerfile
    container_name: load-forecast-service
    ports:
      - "8082:8082"
    volumes:
      - ./load-forecast-service/logs:/app/logs
      - ./load-forecast-service/models:/app/models
    environment:
      - PYTHONPATH=/app
      - MODEL_WEIGHTS_PATH=/app/models/best_powerful_model.weights.h5
      - PREPROCESSOR_PATH=/app/models/preprocessor.pkl
      - TF_ENABLE_ONEDNN_OPTS=0  # Отключаем oneDNN для стабильности
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  passenger-flow-predicted:
    build:
      context: ./passenger-flow-predicted
      dockerfile: Dockerfile
    container_name: passenger-flow-predicted
    ports:
      - "8083:8083"
    environment:
      DB_URL: postgresql://postgres:postgres@postgres:5432/stops
    depends_on:
      - postgres
    volumes:
      - ./models:/app/result/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  video-stream-service:
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 4.4.4.4
    container_name: video-stream-service
    depends_on:
      flowdetect-app:
        condition: service_started
    build:
      context: ./video-stream-service
    entrypoint: bash -c "uv run ./video-stream-service/startup_video_capture.py"
    volumes:
      - type: bind
        source: .
        target: /code
        bind:
          propagation: rprivate
      - /code/.venv
    restart: on-failure

  web-client:
    build:
      context: ./web-client
    container_name: web-client
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - flowdetect-app

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - flowdetect-app

volumes:
  postgres_data: