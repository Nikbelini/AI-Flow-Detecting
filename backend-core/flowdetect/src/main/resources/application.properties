# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/stops
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# JACKSON (JSON) CONFIGURATION
# ===============================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
#server.servlet.context-path=/api
spring.application.name=flowdetect

# ===============================
# ML FORECAST SERVICE CONFIGURATION
# ===============================
ml.forecast.service.url=http://localhost:8082

# ===============================
# FEIGN CLIENT CONFIGURATION
# ===============================
feign.client.config.default.connectTimeout=30000
feign.client.config.default.readTimeout=60000
feign.client.config.default.loggerLevel=full
feign.compression.response.enabled=true
feign.compression.request.enabled=true

# ===============================
# SPRING CLOUD FEIGN CONFIGURATION
# ===============================
spring.cloud.openfeign.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.compression.request.enabled=true
spring.cloud.openfeign.compression.response.enabled=true

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.ru.slivkiai.flowdetect.client=DEBUG
logging.level.feign=DEBUG

# Docker Compose
spring.docker.compose.enabled=false

# SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Security
springdoc.show-actuator=true
springdoc.cache.disabled=true
springdoc.swagger-ui.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Migrat
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true